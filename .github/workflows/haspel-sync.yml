name: Haspeldata bijwerken

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assortiment ophalen en classificeren
        run: node sync/haspel-sync.mjs --out data/haspels.json
      - name: Wijzigingen vastleggen
        run: |
          git config user.name "haspel-sync"
          git config user.email "haspel-sync@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Haspeldata $(date -u +%F)"
          git push
