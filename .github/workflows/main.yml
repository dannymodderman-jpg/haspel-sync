name: Haspeldata bijwerken

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: haspel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assortiment ophalen en classificeren
        run: node sync/haspel-sync.mjs --out data/haspels.json
      - name: Wijzigingen vastleggen
        run: |
          git config user.name "haspel-sync"
          git config user.email "haspel-sync@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Haspeldata $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push mislukt, poging $i – opnieuw over 5 seconden"; sleep 5
          done
          exit 1
